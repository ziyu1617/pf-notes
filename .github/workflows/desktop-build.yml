name: Desktop packages
on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version (no v prefix)
        default: '0.2.0'
        required: true
  push:
    branches: ['codex/desktop-packaging']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
            executable: dist/Smart Notes.app/Contents/MacOS/SmartNotes
          - os: macos-15-intel
            target: macos-x64
            executable: dist/Smart Notes.app/Contents/MacOS/SmartNotes
          - os: windows-2022
            target: windows-x64
            executable: dist/SmartNotes/SmartNotes.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Verify packaging paths and assets
        run: python -m unittest discover -s tests -p "test_packaging.py" -v
      - name: Verify Windows native and single-instance contracts
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p "test_desktop_windows*.py" -v
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Freeze and package on native host
        env:
          SMART_NOTES_VERSION: ${{ inputs.version || '0.2.0' }}
        run: python scripts/build_desktop.py
      - name: Frozen backend and resource smoke
        run: python scripts/smoke_desktop.py "${{ matrix.executable }}" --report "dist/reports/${{ matrix.target }}-backend.json"
      - name: Native renderer smoke
        run: python scripts/smoke_desktop.py "${{ matrix.executable }}" --gui --report "dist/reports/${{ matrix.target }}-gui.json"
      - name: Install, launch, and uninstall Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/releases/SmartNotes-*-windows-x64-setup.exe | Select-Object -First 1
          python scripts/test_windows_installer.py $installer.FullName --reports dist/reports
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload packages and validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartNotes-${{ matrix.target }}
          path: |
            dist/releases/*
            dist/reports/*
          if-no-files-found: warn
          retention-days: 14
